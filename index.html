<body>
  <header>
    <h1>AI Interior Design Assistant</h1>
  </header>

  <main>
    <section id="upload-section">
  <h2>Upload Your Room</h2>
  <input type="file" id="room-photo" accept="image/*">
</section>

    <section id="style-section">
  <h2>Choose a Style</h2>
  <button class="style-option" data-style="modern">Modern</button>
  <button class="style-option" data-style="minimalist">Minimalist</button>
  <button class="style-option" data-style="bohemian">Bohemian</button>
  <button class="style-option" data-style="industrial">Industrial</button>
</section>

    <section id="result-section">
      <h2>Your Redesigned Room</h2>
    </section>
  </main>
</body>
